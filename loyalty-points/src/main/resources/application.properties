spring.application.name=loyalty-points
server.port=8080

# ---------------- MySQL ----------------
# Override with environment variables DB_URL / DB_USERNAME / DB_PASSWORD, or edit the defaults below.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/loyalty_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Jakath@4525}

# The database structure is created by schema.sql (tables + FK/UNIQUE/CHECK constraints) and data.sql (seed tiers)
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------- Configurable business rules ----------------
# Points earned for every Rs. 1 the customer actually pays
loyalty.points-per-rupee=1
# Rs. discount obtained by redeeming 1 point
loyalty.rupees-per-point=0.50

# ---------------- Swagger UI ----------------
springdoc.swagger-ui.path=/swagger-ui.html
